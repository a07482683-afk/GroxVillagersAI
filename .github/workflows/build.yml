name: Build Grox Villagers AI
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6
      - name: Build mod
        run: gradle build
      - name: Prepare only the runnable mod JAR
        shell: bash
        run: |
          set -euo pipefail
          MAIN_JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          test -n "$MAIN_JAR"
          mkdir -p build/release
          cp "$MAIN_JAR" build/release/GroxVillagersAI-1.20.1.jar
          jar tf build/release/GroxVillagersAI-1.20.1.jar | grep -q '^dev/grox/ai/GroxVillagersAI.class$'
          EXPECTED_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          test -n "$EXPECTED_VERSION"
          unzip -p build/release/GroxVillagersAI-1.20.1.jar fabric.mod.json | grep -Fq "\"version\": \"$EXPECTED_VERSION\""
      - name: Upload runnable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: GroxVillagersAI-1.20.1
          path: build/release/GroxVillagersAI-1.20.1.jar
